name: Build WriteFlow

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WriteFlow-Windows
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Linux
        run: npm run build:linux

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: WriteFlow-Linux
          path: dist/*.AppImage

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Mac
        run: npm run build:mac

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: WriteFlow-Mac
          path: dist/*.dmg

  create-release:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          body: |
            ## WriteFlow ${{ github.ref_name }}
            
            ### Downloads
            - **Windows**: WriteFlow Setup .exe
            - **Linux**: WriteFlow .AppImage  
            - **Mac**: WriteFlow .dmg
            
            ### Installation
            - **Windows**: Run installer. Click "More info" → "Run anyway" if SmartScreen warns.
            - **Linux**: `chmod +x WriteFlow*.AppImage` then run it.
            - **Mac**: Open .dmg, drag WriteFlow to Applications.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}